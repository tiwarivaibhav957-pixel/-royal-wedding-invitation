
name: Deploy Wedding Invitation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract website
        run: |
          unzip -q royal-wedding-invitation-github-ready.zip -d extracted
          rm -rf extracted/royal-wedding-invitation/.github
          cp -R extracted/royal-wedding-invitation/. .

      - name: Fix TypeScript configuration
        run: |
          node -e "const fs=require('fs');const p='tsconfig.node.json';const c=JSON.parse(fs.readFileSync(p));delete c.compilerOptions.allowImportingTsExtensions;fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
